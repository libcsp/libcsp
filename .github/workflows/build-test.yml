name: Build and Test
on: [push, pull_request]
jobs:
  run-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-20.04
        buildsystem:
          - meson
          - cmake
          - waf
        compiler:
          - CC: gcc-10
            CXX: g++-10
          - CC: gcc-11
            CXX: g++-11
          - CC: gcc-12
            CXX: g++-12
          - CC: gcc-13
            CXX: g++-13
          - CC: gcc-14
            CXX: g++-14
        exclude:
          # Ubuntu 20.04 only has GCC 10
          - os: ubuntu-20.04
            compiler:
              CC: gcc-11
          - os: ubuntu-20.04
            compiler:
              CC: gcc-12
          - os: ubuntu-20.04
            compiler:
              CC: gcc-13
          - os: ubuntu-20.04
            compiler:
              CC: gcc-14
          # Ubuntu 22.04 only has GCC 10, 11, 12
          - os: ubuntu-22.04
            compiler:
              CC: gcc-13
          - os: ubuntu-22.04
            compiler:
              CC: gcc-14
          # Ubuntu 24.04 only has GCC 12, 13, 14
          - os: ubuntu-24.04
            compiler:
              CC: gcc-10
          - os: ubuntu-24.04
            compiler:
              CC: gcc-11

    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup packages
        run: |
          sudo apt-get update
          sudo apt-get install libzmq3-dev libsocketcan-dev

      - name: Setup build system packages
        if: ${{ matrix.buildsystem != 'waf' }}
        run: |
          sudo apt-get install ninja-build ${{ matrix.buildsystem }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        env:
          CC: ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
        run: python3 ./examples/buildall.py --build-system=${{ matrix.buildsystem }}

      - name: Run Tests
        run: |
          ./build/examples/csp_arch
          ./build/examples/csp_server_client -t
