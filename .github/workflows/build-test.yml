name: Build and Test
on: [push, pull_request]
jobs:
  run-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-20.04
        buildsystem:
          - meson
          - cmake
          - waf
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup packages on Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install libzmq3-dev libsocketcan-dev

      - name: Setup build system packages on Linux
        if: ${{ runner.os == 'Linux' && matrix.buildsystem != 'waf' }}
        run: |
          sudo apt-get install ninja-build ${{ matrix.buildsystem }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: python3 ./examples/buildall.py --build-system=${{ matrix.buildsystem }}

      - name: Run Tests
        run: |
          ./build/examples/csp_arch
          ./build/examples/csp_server_client -t
